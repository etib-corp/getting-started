name: Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  LUNARG_VULKAN_SDK_VERSION: 1.4.304.1
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Ubuntu dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: bash tools/install_ubuntu_dependencies.sh

      # mais embeds Python: the interpreter and its development files must
      # come from the same installation.
      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup the Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.LUNARG_VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # The libraries are fetched at the revisions pinned in
      # cmake/Dependencies.cmake.
      - name: Configure CMake
        run: >
          cmake --preset default
          -DPython_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          -DAPP_DEV_MODE=ON

      # A job count is required: with Makefiles, a bare --parallel starts
      # every compilation at once and the runner runs out of memory.
      - name: Build
        run: cmake --build --preset default --parallel 4

      # Only the tests that need no window run here: the runners have no
      # display and no Vulkan driver.
      - name: Run tests
        run: ctest --preset default

  # The APK for Meta headsets. It is built, not run: the runners have no
  # headset.
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: 21
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle downloads the NDK by itself, but not CMake: install the version
      # named in platforms/android/app/build.gradle.kts.
      - name: Install the SDK's CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.5"

      - name: Build the debug APK
        working-directory: platforms/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Check the APK contents
        working-directory: platforms/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" > apk-contents.txt
          for entry in \
            lib/arm64-v8a/libgetting_started_android.so \
            lib/arm64-v8a/libopenxr_loader.so \
            assets/shaders/default.vert.spv \
            assets/fonts/Roboto-Regular.ttf \
            assets/textures/default_texture.png
          do
            grep -q "$entry" apk-contents.txt || { echo "Missing in APK: $entry"; exit 1; }
          done

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: getting-started-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
